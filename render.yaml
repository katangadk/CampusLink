# Hosted preview. Creating this service incurs Render hosting/storage charges.
services:
  - type: web
    name: campuslink-staging
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m campuslink.serve
    healthCheckPath: /api/health
    disk:
      name: campuslink-staging-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CAMPUSLINK_MODE
        value: staging
      - key: CAMPUSLINK_DB
        value: /var/data/campuslink.sqlite3
      - key: CAMPUSLINK_SUPPORT_EMAIL
        value: kabundakatanga91@gmail.com
      - key: CAMPUSLINK_MAIL_TOKEN_SECRET
        generateValue: true
      - key: CAMPUSLINK_BACKUPS_ENABLED
        value: "true"
      - key: CAMPUSLINK_BACKUP_KEEP
        value: "3"
